name: model-eval-tests

on:
  workflow_call:
    inputs:
      model:
        description: "Model identifier under test"
        required: true
        type: string
      sample_size:
        description: "Number of golden cases to run"
        required: false
        default: "20"
        type: string
      python-version:
        required: false
        default: "3.12"
        type: string

permissions:
  contents: read

jobs:
  test:
    name: model eval tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ inputs.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run eval harness
        run: >
          uv run pytest tests/evals -v
          --model="${{ inputs.model }}"
          --sample-size="${{ inputs.sample_size }}"