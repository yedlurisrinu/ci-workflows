name: gitleaks

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: "Pinned gitleaks release version, without the v prefix"
        required: false
        type: string
        default: "8.30.1"

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GL_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_checksums.txt"
          sha256sum -c "gitleaks_${GL_VERSION}_checksums.txt" --ignore-missing
          tar -xzf "gitleaks_${GL_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan full history
        run: gitleaks git . --log-opts="--all" --redact -v
